name: AgentGuard Attestation Gate

# Runs on pull requests only. Push to main is not gated, because a merge
# commit made by GitHub never has an attestation note, so the gate would
# fail on every merge.
#
# The gate checks pull_request.head.sha, the real last commit of the
# branch. github.sha on a pull_request event is a temporary merge commit
# that GitHub creates, which never has a note.
#
# Status: the fail case (no attestation -> MISSING, exit 1) was confirmed
# on a real runner. The pass case with self-contained notes is still
# being confirmed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  attestation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history - notes reference commits by hash

      # git notes live under refs/notes/*, which actions/checkout never
      # fetches, even with fetch-depth: 0. Without this step the gate
      # reports MISSING on every commit.
      - name: Fetch git notes
        run: git fetch origin 'refs/notes/*:refs/notes/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AgentGuard attestation gate
        run: python ci_enforcement/gate.py --head "${{ github.event.pull_request.head.sha }}"